<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>J.A.R.V.I.S. — Orb Interface</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&family=Orbitron:wght@400;600;700;900&display=swap');

  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #020a14;
    overflow: hidden;
    width: 100vw;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Rajdhani', sans-serif;
  }

  canvas#orbCanvas {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
  }

  /* ── Central text overlay ── */
  .center-text {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    pointer-events: none;
    z-index: 10;
  }

  .title {
    font-family: 'Orbitron', sans-serif;
    font-weight: 900;
    font-size: clamp(28px, 4vw, 52px);
    letter-spacing: 8px;
    color: #ffffff;
    text-shadow:
      0 0 20px rgba(79, 195, 247, 0.6),
      0 0 60px rgba(79, 195, 247, 0.25),
      0 0 120px rgba(79, 195, 247, 0.1);
    font-style: italic;
    animation: titlePulse 4s ease-in-out infinite;
  }

  .subtitle {
    font-family: 'Rajdhani', sans-serif;
    font-weight: 600;
    font-size: clamp(12px, 1.6vw, 20px);
    letter-spacing: 6px;
    color: rgba(79, 195, 247, 0.75);
    margin-top: 6px;
    text-shadow: 0 0 16px rgba(79, 195, 247, 0.5);
    animation: subtitleBlink 2.5s ease-in-out infinite;
  }

  @keyframes titlePulse {
    0%, 100% { opacity: 1; text-shadow: 0 0 20px rgba(79,195,247,0.6), 0 0 60px rgba(79,195,247,0.25); }
    50%      { opacity: 0.92; text-shadow: 0 0 30px rgba(79,195,247,0.8), 0 0 80px rgba(79,195,247,0.35); }
  }

  @keyframes subtitleBlink {
    0%, 100% { opacity: 0.75; }
    50%      { opacity: 1; }
  }

  /* ── Ambient background vignette ── */
  .vignette {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    background: radial-gradient(
      ellipse at center,
      transparent 30%,
      rgba(2, 10, 20, 0.5) 65%,
      rgba(2, 10, 20, 0.95) 100%
    );
    z-index: 5;
  }

  /* ── Ambient glow behind orb ── */
  .ambient-glow {
    position: absolute;
    top: 50%; left: 50%;
    width: 60vmin; height: 60vmin;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    background: radial-gradient(
      circle,
      rgba(30, 136, 200, 0.08) 0%,
      rgba(20, 80, 140, 0.04) 40%,
      transparent 70%
    );
    pointer-events: none;
    z-index: 1;
    animation: ambientPulse 6s ease-in-out infinite;
  }

  @keyframes ambientPulse {
    0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
    50%      { transform: translate(-50%, -50%) scale(1.08); opacity: 0.7; }
  }
</style>
</head>
<body>

<canvas id="orbCanvas"></canvas>
<div class="ambient-glow"></div>
<div class="vignette"></div>

<div class="center-text">
  <div class="title">J.A.R.V.I.S.</div>
  <div class="subtitle">INITIALIZING...</div>
</div>

<script>
(() => {
  const canvas = document.getElementById('orbCanvas');
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;

  function resize() {
    canvas.width = window.innerWidth * dpr;
    canvas.height = window.innerHeight * dpr;
    canvas.style.width = window.innerWidth + 'px';
    canvas.style.height = window.innerHeight + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();

  const TAU = Math.PI * 2;
  const DEG = Math.PI / 180;

  // ─── Helper: draw an arc segment ───
  function arcSeg(cx, cy, r, startDeg, endDeg, lineWidth, color, alpha = 1) {
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.beginPath();
    ctx.arc(cx, cy, r, startDeg * DEG, endDeg * DEG);
    ctx.strokeStyle = color;
    ctx.lineWidth = lineWidth;
    ctx.lineCap = 'butt';
    ctx.stroke();
    ctx.restore();
  }

  // ─── Helper: draw tick marks around a ring ───
  function drawTicks(cx, cy, rInner, rOuter, count, offsetDeg, lineWidth, color, alpha = 1, skipFn = null) {
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.strokeStyle = color;
    ctx.lineWidth = lineWidth;
    ctx.lineCap = 'butt';
    for (let i = 0; i < count; i++) {
      if (skipFn && skipFn(i)) continue;
      const a = (i / count) * TAU + offsetDeg * DEG;
      ctx.beginPath();
      ctx.moveTo(cx + Math.cos(a) * rInner, cy + Math.sin(a) * rInner);
      ctx.lineTo(cx + Math.cos(a) * rOuter, cy + Math.sin(a) * rOuter);
      ctx.stroke();
    }
    ctx.restore();
  }

  // ─── Helper: draw a glowing dot ───
  function glowDot(cx, cy, x, y, radius, color, glowSize = 12) {
    ctx.save();
    ctx.beginPath();
    ctx.arc(x, y, radius, 0, TAU);
    ctx.fillStyle = color;
    ctx.shadowColor = color;
    ctx.shadowBlur = glowSize;
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.restore();
  }

  // ─── Helper: draw a glowing arc ───
  function glowArc(cx, cy, r, startDeg, endDeg, lineWidth, color, glowSize = 14, alpha = 1) {
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.beginPath();
    ctx.arc(cx, cy, r, startDeg * DEG, endDeg * DEG);
    ctx.strokeStyle = color;
    ctx.lineWidth = lineWidth;
    ctx.lineCap = 'round';
    ctx.shadowColor = color;
    ctx.shadowBlur = glowSize;
    ctx.stroke();
    ctx.shadowBlur = 0;
    ctx.restore();
  }

  // ─── Helper: sweeping gradient arc ───
  function sweepArc(cx, cy, r, startDeg, sweepDeg, lineWidth, color, alpha = 1) {
    ctx.save();
    ctx.globalAlpha = alpha;
    const startRad = startDeg * DEG;
    const endRad = (startDeg + sweepDeg) * DEG;

    const grad = ctx.createConicGradient(startRad, cx, cy);
    const frac = sweepDeg / 360;
    grad.addColorStop(0, 'transparent');
    grad.addColorStop(frac * 0.3, color.replace('1)', '0.15)'));
    grad.addColorStop(frac * 0.7, color.replace('1)', '0.6)'));
    grad.addColorStop(frac, color);
    grad.addColorStop(Math.min(1, frac + 0.001), 'transparent');

    ctx.beginPath();
    ctx.arc(cx, cy, r, startRad, endRad);
    ctx.strokeStyle = grad;
    ctx.lineWidth = lineWidth;
    ctx.lineCap = 'round';
    ctx.shadowColor = color.replace('1)', '0.7)');
    ctx.shadowBlur = 18;
    ctx.stroke();
    ctx.shadowBlur = 0;
    ctx.restore();
  }

  // ─── Circuit pattern inside center ───
  function drawCircuitPattern(cx, cy, r, time) {
    ctx.save();
    ctx.globalAlpha = 0.06 + Math.sin(time * 0.5) * 0.02;
    ctx.strokeStyle = 'rgba(79, 195, 247, 1)';
    ctx.lineWidth = 0.5;

    // Horizontal grid lines
    for (let i = -6; i <= 6; i++) {
      const y = cy + i * (r / 8);
      const halfW = Math.sqrt(Math.max(0, r * r - (i * r / 8) * (i * r / 8)));
      if (halfW < 5) continue;
      ctx.beginPath();
      ctx.moveTo(cx - halfW * 0.85, y);
      ctx.lineTo(cx + halfW * 0.85, y);
      ctx.stroke();
    }

    // Vertical grid lines
    for (let i = -6; i <= 6; i++) {
      const x = cx + i * (r / 8);
      const halfH = Math.sqrt(Math.max(0, r * r - (i * r / 8) * (i * r / 8)));
      if (halfH < 5) continue;
      ctx.beginPath();
      ctx.moveTo(x, cy - halfH * 0.85);
      ctx.lineTo(x, cy + halfH * 0.85);
      ctx.stroke();
    }

    // Random "trace" segments
    ctx.globalAlpha = 0.08 + Math.sin(time * 0.7) * 0.03;
    ctx.lineWidth = 1;
    const seed = Math.floor(time * 0.3) * 137;
    for (let i = 0; i < 12; i++) {
      const sx = cx + Math.cos(seed + i * 41) * r * 0.5;
      const sy = cy + Math.sin(seed + i * 67) * r * 0.3;
      const ex = sx + (Math.cos(seed + i * 23) > 0 ? 1 : -1) * (10 + (i % 4) * 8);
      const ey = sy;
      const dx = Math.sqrt((sx - cx) ** 2 + (sy - cy) ** 2);
      if (dx > r * 0.8) continue;
      ctx.beginPath();
      ctx.moveTo(sx, sy);
      ctx.lineTo(ex, ey);
      ctx.lineTo(ex, ey + (Math.sin(seed + i * 31) > 0 ? 1 : -1) * (6 + (i % 3) * 5));
      ctx.stroke();
    }

    ctx.restore();
  }

  // ─── Main animation loop ───
  let t = 0;

  function draw() {
    const w = window.innerWidth;
    const h = window.innerHeight;
    const cx = w / 2;
    const cy = h / 2;
    const baseR = Math.min(w, h) * 0.36;

    ctx.clearRect(0, 0, w, h);

    // Background gradient
    const bgGrad = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.max(w, h) * 0.7);
    bgGrad.addColorStop(0, '#081824');
    bgGrad.addColorStop(0.4, '#040e18');
    bgGrad.addColorStop(1, '#020a14');
    ctx.fillStyle = bgGrad;
    ctx.fillRect(0, 0, w, h);

    t += 0.008;
    const time = t;

    // ════════════════════════════════════════════════
    // RING 1 — Outermost thin ring with major ticks
    // ════════════════════════════════════════════════
    const r1 = baseR * 1.0;
    const rot1 = time * 12; // slow rotation in degrees

    // Thin base ring
    arcSeg(cx, cy, r1, 0, 360, 1.2, 'rgba(79, 195, 247, 0.18)', 1);

    // Major ticks (40)
    drawTicks(cx, cy, r1 - 12, r1 - 2, 40, rot1, 1.4, 'rgba(79, 195, 247, 0.35)');

    // Minor ticks (120)
    drawTicks(cx, cy, r1 - 7, r1 - 2, 120, rot1, 0.6, 'rgba(79, 195, 247, 0.15)');

    // Sweeping glow on outer ring
    sweepArc(cx, cy, r1, rot1 * 2.5, 90, 2.5, 'rgba(79, 195, 247, 1)', 0.7);


    // ════════════════════════════════════════════════
    // RING 2 — Thick cyan ring with glow segments
    // ════════════════════════════════════════════════
    const r2 = baseR * 0.88;
    const rot2 = -time * 8;

    // Base thick ring
    arcSeg(cx, cy, r2, 0, 360, 4, 'rgba(79, 195, 247, 0.12)', 1);

    // Bright cyan arc segments (multiple, staggered)
    glowArc(cx, cy, r2, rot2 + 10, rot2 + 80, 4.5, 'rgba(79, 195, 247, 0.7)', 16, 0.85);
    glowArc(cx, cy, r2, rot2 + 130, rot2 + 200, 4.5, 'rgba(100, 210, 255, 0.5)', 12, 0.6);
    glowArc(cx, cy, r2, rot2 + 260, rot2 + 310, 3.5, 'rgba(79, 195, 247, 0.4)', 10, 0.5);

    // Gap indicators on ring 2 (short bright dashes)
    for (let i = 0; i < 8; i++) {
      const a = (i / 8) * 360 + rot2;
      arcSeg(cx, cy, r2, a, a + 3, 6, 'rgba(79, 195, 247, 0.6)', 0.7);
    }


    // ════════════════════════════════════════════════
    // RING 3 — Dense tick ring (gauge style)
    // ════════════════════════════════════════════════
    const r3 = baseR * 0.78;
    const rot3 = time * 5;

    // Base ring
    arcSeg(cx, cy, r3, 0, 360, 1, 'rgba(79, 195, 247, 0.1)', 1);

    // Dense ticks (80)
    drawTicks(cx, cy, r3 - 8, r3, 80, rot3, 1, 'rgba(79, 195, 247, 0.28)');

    // Extra-dense micro ticks (200)
    drawTicks(cx, cy, r3 - 4, r3, 200, rot3, 0.4, 'rgba(79, 195, 247, 0.12)');


    // ════════════════════════════════════════════════
    // AMBER ACCENT ARC (left side)
    // ════════════════════════════════════════════════
    const amberR = baseR * 0.82;
    const amberStart = 160 + Math.sin(time * 0.6) * 8;
    const amberEnd = amberStart + 65;

    glowArc(cx, cy, amberR, amberStart, amberEnd, 5, 'rgba(255, 193, 7, 0.85)', 18, 0.9);

    // Amber accent — thinner inner echo
    glowArc(cx, cy, amberR - 6, amberStart + 5, amberEnd - 5, 2, 'rgba(255, 193, 7, 0.4)', 8, 0.5);

    // Amber indicator dots
    const amberDotAngles = [amberStart + 12, amberStart + 30, amberStart + 48];
    amberDotAngles.forEach((deg, i) => {
      const a = deg * DEG;
      const dotR = amberR + 8;
      const x = cx + Math.cos(a) * dotR;
      const y = cy + Math.sin(a) * dotR;
      const pulse = 0.7 + Math.sin(time * 3 + i * 1.5) * 0.3;
      glowDot(cx, cy, x, y, 2.5, `rgba(255, 210, 50, ${pulse})`, 10);
    });


    // ════════════════════════════════════════════════
    // RING 4 — Inner segmented ring
    // ════════════════════════════════════════════════
    const r4 = baseR * 0.65;
    const rot4 = -time * 15;

    // Segmented blocks (12 segments with gaps)
    for (let i = 0; i < 12; i++) {
      const seg = (i / 12) * 360 + rot4;
      const alpha = 0.15 + (i % 3 === 0 ? 0.25 : 0);
      arcSeg(cx, cy, r4, seg + 3, seg + 25, 8, `rgba(79, 195, 247, ${alpha})`, 1);
    }

    // Bright segment (sweeping highlight)
    const highlightSeg = ((time * 30) % 360);
    arcSeg(cx, cy, r4, highlightSeg + rot4, highlightSeg + rot4 + 30, 8, 'rgba(79, 195, 247, 0.5)', 0.8);


    // ════════════════════════════════════════════════
    // RING 5 — Inner thin ring
    // ════════════════════════════════════════════════
    const r5 = baseR * 0.55;

    arcSeg(cx, cy, r5, 0, 360, 1, 'rgba(79, 195, 247, 0.12)', 1);

    // Small ticks (30)
    drawTicks(cx, cy, r5, r5 + 5, 30, -time * 3, 0.8, 'rgba(79, 195, 247, 0.2)');

    // Sweeping inner arc
    sweepArc(cx, cy, r5, -time * 20, 60, 1.5, 'rgba(79, 195, 247, 1)', 0.5);


    // ════════════════════════════════════════════════
    // RING 6 — Innermost decorative ring
    // ════════════════════════════════════════════════
    const r6 = baseR * 0.46;

    arcSeg(cx, cy, r6, 0, 360, 0.8, 'rgba(79, 195, 247, 0.08)', 1);

    // Dashed ring
    ctx.save();
    ctx.setLineDash([4, 8]);
    arcSeg(cx, cy, r6, 0, 360, 0.8, 'rgba(79, 195, 247, 0.15)', 1);
    ctx.setLineDash([]);
    ctx.restore();


    // ════════════════════════════════════════════════
    // CENTER — Dark disc with circuit pattern
    // ════════════════════════════════════════════════
    const centerR = baseR * 0.42;

    // Dark center fill
    ctx.save();
    const centerGrad = ctx.createRadialGradient(cx, cy, 0, cx, cy, centerR);
    centerGrad.addColorStop(0, 'rgba(8, 20, 36, 0.95)');
    centerGrad.addColorStop(0.6, 'rgba(6, 16, 30, 0.9)');
    centerGrad.addColorStop(1, 'rgba(4, 12, 24, 0.85)');
    ctx.beginPath();
    ctx.arc(cx, cy, centerR, 0, TAU);
    ctx.fillStyle = centerGrad;
    ctx.fill();
    ctx.restore();

    // Circuit pattern
    drawCircuitPattern(cx, cy, centerR, time);

    // Inner glow ring around center
    ctx.save();
    ctx.beginPath();
    ctx.arc(cx, cy, centerR, 0, TAU);
    ctx.strokeStyle = 'rgba(79, 195, 247, 0.15)';
    ctx.lineWidth = 1.5;
    ctx.shadowColor = 'rgba(79, 195, 247, 0.3)';
    ctx.shadowBlur = 10;
    ctx.stroke();
    ctx.restore();


    // ════════════════════════════════════════════════
    // DECORATIVE — Corner brackets / HUD trim
    // ════════════════════════════════════════════════

    // Small cyan dots at cardinal points on ring 2
    [0, 90, 180, 270].forEach((deg, i) => {
      const a = (deg + rot2 * 0.5) * DEG;
      const x = cx + Math.cos(a) * (r2 + 1);
      const y = cy + Math.sin(a) * (r2 + 1);
      const pulse = 0.5 + Math.sin(time * 2 + i * 1.2) * 0.3;
      glowDot(cx, cy, x, y, 2, `rgba(79, 195, 247, ${pulse})`, 8);
    });

    // Bright cyan dot at 12-o'clock on outer ring (beacon)
    const beaconAngle = (-90 + rot1 * 0.8) * DEG;
    const bx = cx + Math.cos(beaconAngle) * (r1 + 2);
    const by = cy + Math.sin(beaconAngle) * (r1 + 2);
    const beaconPulse = 0.6 + Math.sin(time * 5) * 0.4;
    glowDot(cx, cy, bx, by, 3, `rgba(79, 220, 255, ${beaconPulse})`, 16);


    // ════════════════════════════════════════════════
    // DECORATIVE — Secondary amber accents
    // ════════════════════════════════════════════════

    // Small amber arc on ring 4 (right side)
    const amberR2Start = -20 + Math.sin(time * 0.4) * 5;
    glowArc(cx, cy, r4 + 2, amberR2Start, amberR2Start + 25, 2, 'rgba(255, 193, 7, 0.45)', 8, 0.6);


    // ════════════════════════════════════════════════
    // OUTER DECORATIVE — Faint outermost halo
    // ════════════════════════════════════════════════
    const rHalo = baseR * 1.08;
    arcSeg(cx, cy, rHalo, 0, 360, 0.5, 'rgba(79, 195, 247, 0.06)', 1);

    // Partial arc accents on halo
    glowArc(cx, cy, rHalo, rot1 * 0.5 + 30, rot1 * 0.5 + 60, 1.5, 'rgba(79, 195, 247, 0.25)', 6, 0.4);
    glowArc(cx, cy, rHalo, rot1 * 0.5 + 200, rot1 * 0.5 + 240, 1.5, 'rgba(79, 195, 247, 0.2)', 6, 0.3);


    // ════════════════════════════════════════════════
    // FLOATING PARTICLES (ambient dust)
    // ════════════════════════════════════════════════
    ctx.save();
    for (let i = 0; i < 30; i++) {
      const angle = (i / 30) * TAU + time * 0.3 + i * 0.7;
      const dist = baseR * (0.5 + 0.6 * ((Math.sin(time * 0.2 + i * 2.1) + 1) / 2));
      const px = cx + Math.cos(angle) * dist;
      const py = cy + Math.sin(angle) * dist;
      const pAlpha = 0.06 + Math.sin(time * 1.5 + i * 3) * 0.04;
      const pSize = 0.8 + Math.sin(time + i) * 0.4;
      ctx.globalAlpha = pAlpha;
      ctx.beginPath();
      ctx.arc(px, py, pSize, 0, TAU);
      ctx.fillStyle = 'rgba(79, 195, 247, 1)';
      ctx.fill();
    }
    ctx.restore();

    requestAnimationFrame(draw);
  }

  requestAnimationFrame(draw);
})();
</script>
</body>
</html>
