[project]
name = "jarvis-engine"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "nithish0302", email = "nithish2005palani@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "chromadb>=1.5.9",
    "duckduckgo-search>=8.1.1",
    "edge-tts>=7.2.8",
    "fastapi>=0.141.1",
    "faster-whisper>=1.2.1",
    "groq>=1.6.0",
    "httpx>=0.28.1",
    "kokoro>=0.8",
    "numpy>=2.5.1",
    "nvidia-cublas-cu12>=12.9.2.10",
    "onnxruntime-gpu>=1.29.0",
    "openwakeword>=0.4.0",
    "pydantic-settings>=2.14.2",
    "pygame>=2.6.1",
    "python-dotenv>=1.2.2",
    "sentence-transformers>=5.7.0",
    "sounddevice>=0.5.6",
    "soundfile>=0.14.0",
    "tavily-python>=0.7.27",
    "torch>=2.9.0",
    "uvicorn>=0.52.1",
]

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
override-dependencies = [
    "onnxruntime ; python_version < '0'",
]

[tool.uv.sources]
torch = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.ruff]
line-length = 88
target-version = "py312"
lint.select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "ARG", "PTH", "ERA", "PL", "RUF"]

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "black>=26.5.1",
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.1",
]
